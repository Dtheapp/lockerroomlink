<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="100%" style="stop-color:#A855F7"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background: matches icon-192.png / icon-512.png so the icon is
       identical everywhere. Square (no rounding) because the manifest marks the
       PNGs maskable and the OS applies its own shape. -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Lightning bolt, sized to stay inside the maskable safe zone -->
  <path d="M268.37 132.27 L144.64 280.75 L256 280.75 L243.63 379.73 L367.36 231.25 L256 231.25 Z"
        fill="#ffffff"/>
</svg>
